name: Build Navisworks Plugin

on:
  push:
    branches:
      - main
      - 'experiment-*'  
      - 'test-*'
      - 'feature-*'
  pull_request:
    branches:
      - main
      - 'experiment-*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'experimental'
        type: choice
        options:
          - experimental
          - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # ЗАПУСКАЕМСЯ ДЛЯ ЛЮБОЙ ВЕТКИ
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check libs
        run: dir mainPlugin-master\ClashManager\libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build with MSBuild
        run: msbuild mainPlugin-master\ClashManager\С.M.2021.csproj /p:Configuration=Debug /p:OutputPath=bin\Debug
        working-directory: ${{ github.workspace }}

      - name: Show all build outputs
        run: dir mainPlugin-master\ClashManager -Recurse
        working-directory: ${{ github.workspace }}

      - name: List build output
        run: dir .\mainPlugin-master\ClashManager\bin\Debug -Recurse
        working-directory: ${{ github.workspace }}

      - name: Archive plugin DLL + PDB
        run: |
          mkdir publish
          copy "mainPlugin-master\ClashManager\bin\Debug\*.dll" publish\
          copy "mainPlugin-master\ClashManager\bin\Debug\*.pdb" publish\
          Compress-Archive -Path publish\* -DestinationPath plugin.zip

      - name: Upload artifact (download via Actions)
        uses: actions/upload-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: plugin.zip

  release:
    needs: build
    runs-on: windows-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/experiment-') ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for pushing tags

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: .

      - name: Create Git tag
        id: create-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_NAME="v${{ github.run_number }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
            TAG_NAME="experimental-${{ github.run_number }}-$BRANCH_NAME"
          fi
          
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create-tag.outputs.tag_name }}
          name: ${{ github.ref == 'refs/heads/main' && 'Stable Build' || 'Experimental Build' }} ${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: plugin.zip
          body: |
            ${{ github.ref != 'refs/heads/main' && '⚠️ ЭКСПЕРИМЕНТАЛЬНАЯ ВЕРСИЯ - МОГУТ БЫТЬ ОШИБКИ ⚠️' || '✅ Стабильная версия' }}
            
            **Детали сборки:**
            - Ветка: ${{ github.ref_name }}
            - Коммит: ${{ github.sha }}
            - Запуск: ${{ github.run_number }}
            
            ${{ startsWith(github.ref, 'refs/heads/experiment-') && '**Использовать на свой страх и риск!**' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
