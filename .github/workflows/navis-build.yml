name: Build Navisworks Plugin

on:
  push:
    branches:
      - main
      - 'experiment-*'
      - 'test-*'
      - 'feature-*'
  pull_request:
    branches:
      - main
      - 'experiment-*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'experimental'
        type: choice
        options:
          - experimental
          - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # КЭШ NUGET ПАКЕТОВ
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\NuGet\v3-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: List workspace files
        run: |
          echo "=== FILES IN WORKSPACE ==="
          dir .
          echo "=== RECURSIVE ==="
          dir /s
        shell: cmd
      # ВОССТАНОВЛЕНИЕ ПАКЕТОВ
      - name: Restore NuGet packages
        run: nuget restore "CUM.sln"
        shell: cmd
        working-directory: ${{ github.workspace }}

      # СБОРКА
      - name: Build with MSBuild
        run: |
          msbuild "mainPlugin-master\ClashManager\С.M.2021.csproj" ^
            /p:Configuration=Debug ^
            /p:OutputPath=bin\Debug ^
            /p:WarningLevel=0
        shell: cmd
        working-directory: ${{ github.workspace }}

      # ПРОВЕРКА ВЫВОДА
      - name: Verify build output
        run: |
          if not exist "mainPlugin-master\ClashManager\bin\Debug\*.dll" (
            echo "ERROR: DLL not found after build!"
            exit 1
          )
          echo "Build successful. DLLs:"
          dir "mainPlugin-master\ClashManager\bin\Debug\*.dll"
          dir "mainPlugin-master\ClashManager\bin\Debug\*.pdb"
        shell: powershell

      # АРХИВ
      - name: Archive plugin DLL + PDB
        run: |
          mkdir publish -Force
          copy "mainPlugin-master\ClashManager\bin\Debug\*.dll" publish\
          copy "mainPlugin-master\ClashManager\bin\Debug\*.pdb" publish\
          Compress-Archive -Path publish\* -DestinationPath plugin.zip -Force
        shell: powershell

      # ЗАГРУЗКА АРТЕФАКТА
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: plugin.zip

  # РЕЛИЗ
  release:
    needs: build
    runs-on: windows-latest
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/experiment-')
      ) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: .

      - name: Determine release type and tag
        id: release
        run: |
          IS_STABLE=false
          BRANCH="${{ github.ref_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TYPE="${{ github.event.inputs.release_type }}"
            if [ "$INPUT_TYPE" = "stable" ]; then
              IS_STABLE=true
              TAG_NAME="v${{ github.run_number }}"
            else
              TAG_NAME="experimental-${{ github.run_number }}-$BRANCH"
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            IS_STABLE=true
            TAG_NAME="v${{ github.run_number }}"
          else
            TAG_NAME="experimental-${{ github.run_number }}-$BRANCH"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_stable=$IS_STABLE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Git tag
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag "${{ steps.release.outputs.tag_name }}"
          git push origin "${{ steps.release.outputs.tag_name }}"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.is_stable == 'true' && 'Stable Build' || 'Experimental Build' }} #${{ github.run_number }}
          prerelease: ${{ steps.release.outputs.is_stable != 'true' }}
          files: plugin.zip
          body: |
            ${{ steps.release.outputs.is_stable == 'true' && 'СТАБИЛЬНАЯ ВЕРСИЯ' || 'ЭКСПЕРИМЕНТАЛЬНАЯ ВЕРСИЯ - МОГУТ БЫТЬ ОШИБКИ' }}

            **Сборка:**
            - Ветка: `${{ steps.release.outputs.branch }}`
            - Коммит: `${{ github.sha }}`
            - Запуск: `#${{ github.run_number }}`
            - Тип: ${{ steps.release.outputs.is_stable == 'true' && 'stable' || 'experimental' }}

            ${{ startsWith(github.ref_name, 'experiment-') && '**Только для тестирования!**' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
