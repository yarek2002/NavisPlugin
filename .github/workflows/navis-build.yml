name: Build Navisworks Plugin

on:
  push:
    branches:
      - main   # запуск только при пуше в main
      - experiment-*   # добавляем экспериментальные ветки

    paths-ignore:
      - "README.md"   # игнорировать изменения README
      - "README.MD"   # (на всякий случай, если кто-то изменит регистр)

  workflow_dispatch:   # Ручной запуск для любых веток
    inputs:
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'experimental'
        type: choice
        options:
        - experimental
        - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check libs
        run: dir mainPlugin-master\ClashManager\libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build with MSBuild
        run: msbuild mainPlugin-master\ClashManager\С.M.2021.csproj /p:Configuration=Debug /p:OutputPath=bin\Debug
        working-directory: ${{ github.workspace }}

      - name: Show all build outputs
        run: dir mainPlugin-master\ClashManager -Recurse
        working-directory: ${{ github.workspace }}

      - name: List build output
        run: dir .\mainPlugin-master\ClashManager\bin\Debug -Recurse
        working-directory: ${{ github.workspace }}

      - name: Archive plugin DLL + PDB
        run: |
          mkdir publish
          copy "mainPlugin-master\ClashManager\bin\Debug\*.dll" publish\
          copy "mainPlugin-master\ClashManager\bin\Debug\*.pdb" publish\
          Compress-Archive -Path publish\* -DestinationPath plugin.zip

      - name: Upload artifact (download via Actions)
        uses: actions/upload-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: plugin.zip

  release:
    needs: build
    runs-on: windows-latest
    # Запускаем релиз для main ИЛИ экспериментальных веток ИЛИ ручного запуска
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/experiment-') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: .

      - name: Determine release type
        id: release-info
        run: |
          # Определяем тип релиза
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $releaseType = "${{ github.event.inputs.release_type }}"
          } elseif ("${{ github.ref }}" -eq "refs/heads/main") {
            $releaseType = "stable"
          } else {
            $releaseType = "experimental"
          }
          
          # Генерируем название и тег
          $runNumber = "${{ github.run_number }}"
          $branchName = "${{ github.ref_name }}"
          
          if ($releaseType -eq "stable") {
            $tagName = "v$runNumber"
            $releaseName = "Stable Build $runNumber"
            $isPreRelease = "false"
          } else {
            $tagName = "experimental-$runNumber"
            $releaseName = "Experimental Build $runNumber - $branchName"
            $isPreRelease = "true"
          }
          
          # Выводим переменные
          Write-Output "tag_name=$tagName"
          Write-Output "release_name=$releaseName"
          Write-Output "prerelease=$isPreRelease"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag_name }}
          name: ${{ steps.release-info.outputs.release_name }}
          prerelease: ${{ steps.release-info.outputs.prerelease }}
          files: plugin.zip
          body: |
            ${{ github.ref_name != 'main' && '⚠️ ЭКСПЕРИМЕНТАЛЬНАЯ ВЕРСИЯ - МОГУТ БЫТЬ ОШИБКИ ⚠️' || '✅ Стабильная версия' }}
            
            **Детали сборки:**
            - Ветка: ${{ github.ref_name }}
            - Коммит: ${{ github.sha }}
            - Запуск: ${{ github.run_number }}
            
            ${{ startsWith(github.ref, 'refs/heads/experiment-') && '**Использовать на свой страх и риск!**' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
