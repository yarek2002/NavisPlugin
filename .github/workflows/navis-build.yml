name: Build Navisworks Plugin

on:
  push:
    branches:
      - main   # запуск только при пуше в main
      - 'experiment-*'   # добавляем экспериментальные ветки

    paths-ignore:
      - "README.md"   # игнорировать изменения README
      - "README.MD"   # (на всякий случай, если кто-то изменит регистр)

  workflow_dispatch:   # Ручной запуск для любых веток
    inputs:
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'experimental'
        type: choice
        options:
        - experimental
        - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check libs
        run: dir mainPlugin-master\ClashManager\libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build with MSBuild
        run: msbuild mainPlugin-master\ClashManager\С.M.2021.csproj /p:Configuration=Debug /p:OutputPath=bin\Debug
        working-directory: ${{ github.workspace }}

      - name: Show all build outputs
        run: dir mainPlugin-master\ClashManager -Recurse
        working-directory: ${{ github.workspace }}

      - name: List build output
        run: dir .\mainPlugin-master\ClashManager\bin\Debug -Recurse
        working-directory: ${{ github.workspace }}

      - name: Archive plugin DLL + PDB
        run: |
          mkdir publish
          copy "mainPlugin-master\ClashManager\bin\Debug\*.dll" publish\
          copy "mainPlugin-master\ClashManager\bin\Debug\*.pdb" publish\
          Compress-Archive -Path publish\* -DestinationPath plugin.zip

      - name: Upload artifact (download via Actions)
        uses: actions/upload-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: plugin.zip

  release:
    needs: build
    runs-on: windows-latest
    # Запускаем релиз для main ИЛИ экспериментальных веток ИЛИ ручного запуска
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/experiment-') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: navisworks-plugin-debug
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.ref_name == 'main' && 'Stable Build' || 'Experimental Build' }} ${{ github.run_number }} - ${{ github.ref_name }}
          prerelease: ${{ github.ref_name != 'main' }}
          files: plugin.zip
          body: |
            ${{ github.ref_name != 'main' && '⚠️ ЭКСПЕРИМЕНТАЛЬНАЯ ВЕРСИЯ - МОГУТ БЫТЬ ОШИБКИ ⚠️' || '✅ Стабильная версия' }}
            
            **Детали сборки:**
            - Ветка: ${{ github.ref_name }}
            - Коммит: ${{ github.sha }}
            - Запуск: ${{ github.run_number }}
            - Дата: ${{ github.event.head_commit.timestamp }}
            
            ${{ startsWith(github.ref, 'refs/heads/experiment-') && '**Использовать на свой страх и риск!**' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
